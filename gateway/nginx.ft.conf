# FT: two instances per service. Passive health checks: after 1 failed request
# an instance is skipped for 5 s, and the request is retried on the other one.
resolver 127.0.0.11 valid=5s ipv6=off;  # Docker DNS, so restarted containers are found again

# Stage E3 rate limits, per client IP. nodelay: requests inside the burst are served at once,
# requests above it get 429 at once (no queue, so no added latency).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=payments:10m rate=20r/s;
limit_req_status 429;
map $status $rate_limited {   # 429 lines go to a file that gateway-exporter counts
    429     1;
    default 0;
}

upstream student {
    zone student 64k;
    server student-service-1:8000 resolve max_fails=1 fail_timeout=5s;
    server student-service-2:8000 resolve max_fails=1 fail_timeout=5s;
}
upstream payment {
    zone payment 64k;
    server payment-service-1:8000 resolve max_fails=1 fail_timeout=5s;
    server payment-service-2:8000 resolve max_fails=1 fail_timeout=5s;
}
upstream transcript {
    zone transcript 64k;
    server transcript-service-1:8000 resolve max_fails=1 fail_timeout=5s;
    server transcript-service-2:8000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    access_log /dev/stdout json_access if=$log_request;
    access_log /var/log/gateway/rate_limited.json json_access if=$rate_limited;
    proxy_set_header X-Request-ID $req_id;
    proxy_hide_header X-Request-ID;           # the header is added once, below
    add_header X-Request-ID $req_id always;   # also on errors nginx generates itself (502, 504, 429)
    proxy_set_header X-Real-IP $remote_addr;  # services write the client IP into the audit log
    proxy_set_header X-Probe "";              # a client cannot label its traffic as a health check
    client_max_body_size 16k;                 # no request needs more; larger bodies get 413
    proxy_connect_timeout 1s;
    # Try the other instance on connection errors, timeouts and 502.
    # POSTs already sent to an instance are NOT retried (nginx default), to avoid double payments.
    proxy_next_upstream error timeout http_502;
    error_page 429 = @rate_limited;

    location = /auth/login  { limit_req zone=login burst=10 nodelay; proxy_pass http://student; }
    location /students      { proxy_pass http://student; }
    location /registrations { proxy_pass http://student; }
    location /timetable     { proxy_pass http://student; }
    location /payments      { limit_req zone=payments burst=40 nodelay; proxy_pass http://payment; }
    location /transcripts   { proxy_pass http://transcript; }
    location = /health      { return 200 "gateway ok\n"; }
    location = /health/student-service { proxy_pass http://student/health; }  # used by transcript /ready
    location @rate_limited  { default_type application/json; return 429 '{"detail":"too many requests"}\n'; }
    # Not routed on purpose: /admin/* of any service, mock-bank, /metrics. They get 404 here.
}
