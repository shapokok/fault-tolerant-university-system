# Baseline: one instance per service, no health checks, no failover.
upstream student    { server student-service:8000; }
upstream payment    { server payment-service:8000; }
upstream transcript { server transcript-service:8000; }

server {
    listen 80;
    access_log /dev/stdout json_access;
    proxy_set_header X-Request-ID $req_id;
    proxy_hide_header X-Request-ID;           # the header is added once, below
    add_header X-Request-ID $req_id always;   # also on errors nginx generates itself (502, 504)

    location /students      { proxy_pass http://student; }
    location /registrations { proxy_pass http://student; }
    location /timetable     { proxy_pass http://student; }
    location /payments      { proxy_pass http://payment; }
    location /transcripts   { proxy_pass http://transcript; }
    location = /health      { return 200 "gateway ok\n"; }
}
