# Loaded before the server block (conf.d is read in name order). Used by both modes.

# Correlation ID: keep a valid ID from the client, otherwise use the one nginx generates.
map $http_x_request_id $req_id {
    default                     $request_id;
    "~^[A-Za-z0-9_-]{1,64}$"    $http_x_request_id;
}

# One JSON object per request. nginx only knows the duration in seconds, hence latency_s.
log_format json_access escape=json
    '{"ts":$msec,"level":"INFO","service":"gateway","instance":"$hostname",'
    '"request_id":"$req_id","method":"$request_method","path":"$uri","status":$status,'
    '"latency_s":$request_time,"user_id":null,"event":"http_request","message":"",'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
