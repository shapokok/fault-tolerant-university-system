# Scrape every 2 s, evaluate rules every 5 s.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    honor_labels: true  # keep our own "instance" label on the metrics
    static_configs:
      - targets:
          - student-service-1:8000
          - student-service-2:8000
          - transcript-service-1:8000
          - transcript-service-2:8000
          - payment-service-1:8000
          - payment-service-2:8000
          - mock-bank:8000
    relabel_configs:  # up{instance="payment-service-1"} instead of payment-service-1:8000
      - source_labels: [__address__]
        regex: "([^:]+):[0-9]+"
        target_label: instance
        replacement: "$1"
