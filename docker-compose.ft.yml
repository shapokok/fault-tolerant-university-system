# Endterm stack: fault tolerance (FT_MODE=on) and security (SECURITY_MODE=on).
# 2 instances per service behind nginx, primary + streaming replica, restart policies and
# healthchecks, scheduled backups, login tokens, rate limits, audit log, least-privilege DB role.
# All passwords and the token secret come from .env (not committed, see .env.example).
# "Node" = group of containers. Label node=b marks node-b; stop it with:
#   docker stop $(docker ps -q --filter label=node=b)
name: uni-ft

x-app: &app
  build: ./services
  restart: unless-stopped
  init: true  # tini is PID 1, so killing the app process is a real crash that the restart policy handles
  environment:
    FT_MODE: "on"
    SECURITY_MODE: "on"
    # uni_app: the least-privilege role (no DROP, ALTER, TRUNCATE or DELETE, audit_log insert only)
    DATABASE_URL: postgresql://uni_app:${APP_DB_PASSWORD}@postgres-primary:5432/uni
    REPLICA_URL: postgresql://uni_app:${APP_DB_PASSWORD}@postgres-replica:5432/uni
    JWT_SECRET: ${JWT_SECRET}
    STUDENT_URL: http://gateway  # transcript reaches student-service through the load balancer
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 2s
    timeout: 2s
    retries: 3
  depends_on:
    postgres-primary:
      condition: service_healthy

x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  environment: &pg-env
    POSTGRES_USER: uni
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: uni
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "uni"]
    interval: 2s
    retries: 30

services:
  # ---------- node-a ----------
  postgres-primary:
    <<: *postgres
    labels: {node: a}
    environment:
      <<: *pg-env
      # read only by the init scripts in db/init (first start)
      SECURITY_MODE: "on"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro

  student-service-1:
    <<: *app
    hostname: student-service-1
    labels: {node: a}
    command: uvicorn student:app --host 0.0.0.0 --port 8000

  transcript-service-1:
    <<: *app
    hostname: transcript-service-1
    labels: {node: a}
    command: uvicorn transcript:app --host 0.0.0.0 --port 8000

  payment-service-1:
    <<: *app
    hostname: payment-service-1
    labels: {node: a}
    command: uvicorn payment:app --host 0.0.0.0 --port 8000

  gateway:
    hostname: gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    labels: {node: a}
    volumes:
      - ./gateway/observability.conf:/etc/nginx/conf.d/00-observability.conf:ro
      - ./gateway/nginx.ft.conf:/etc/nginx/conf.d/default.conf:ro
      - gateway-logs:/var/log/gateway  # 429 lines for gateway-exporter
    ports:
      - "8080:80"

  gateway-exporter:  # counts the 429s nginx sends itself (rate_limited_total)
    hostname: gateway-exporter
    build: ./services
    restart: unless-stopped
    labels: {node: a}
    command: python gateway_exporter.py
    volumes:
      - gateway-logs:/logs:ro

  monitor:
    build: ./services
    restart: unless-stopped
    labels: {node: a}
    command: python monitor.py
    environment:
      MONITOR_OUT: /results/${MONITOR_FILE:-monitor_ft.csv}
      MONITOR_TARGETS: >-
        student-1=http://student-service-1:8000,student-2=http://student-service-2:8000,transcript-1=http://transcript-service-1:8000,transcript-2=http://transcript-service-2:8000,payment-1=http://payment-service-1:8000,payment-2=http://payment-service-2:8000,mock-bank=http://mock-bank:8000
    volumes:
      - ./results:/results

  backup:
    image: postgres:16
    restart: unless-stopped
    labels: {node: a}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_S: 60
      BACKUP_KEEP: 10
    entrypoint: ["bash", "/infra/backup.sh"]
    volumes:
      - ./infra:/infra:ro
      - ./backups:/backups
    depends_on:
      postgres-primary:
        condition: service_healthy

  # ---------- node-b ----------
  postgres-replica:
    <<: *postgres
    labels: {node: b}
    user: postgres
    entrypoint: ["bash", "/infra/replica-entrypoint.sh"]
    environment:
      <<: *pg-env
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    volumes:
      - ./infra:/infra:ro
    depends_on:
      postgres-primary:
        condition: service_healthy

  student-service-2:
    <<: *app
    hostname: student-service-2
    labels: {node: b}
    command: uvicorn student:app --host 0.0.0.0 --port 8000

  transcript-service-2:
    <<: *app
    hostname: transcript-service-2
    labels: {node: b}
    command: uvicorn transcript:app --host 0.0.0.0 --port 8000

  payment-service-2:
    <<: *app
    hostname: payment-service-2
    labels: {node: b}
    command: uvicorn payment:app --host 0.0.0.0 --port 8000

  # ---------- external ----------
  mock-bank:
    hostname: mock-bank
    build: ./services
    restart: unless-stopped
    command: uvicorn mockbank:app --host 0.0.0.0 --port 8000
    ports:
      # Not routed through the gateway. Bound to localhost only, for the fault-injection
      # scripts on this machine; other machines cannot reach /admin/fault.
      - "127.0.0.1:8090:8000"

  # ---------- observability (both modes, measurement only) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    labels: {node: a}
    volumes:
      - ./prometheus/prometheus.ft.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    labels: {node: a}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/university.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  workload:
    build: ./services
    profiles: ["tools"]
    environment:
      SECURITY_MODE: "on"  # the workload logs in as student1..student50
      STUDENT_PASSWORD: ${STUDENT_PASSWORD}
    volumes:
      - ./experiments:/exp
      - ./results:/results
    command: python /exp/workload.py

volumes:
  gateway-logs:
