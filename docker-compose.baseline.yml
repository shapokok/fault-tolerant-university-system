# Baseline: 1 instance per service, single DB, FT_MODE=off, no restart policies.
name: uni-baseline

x-service: &service
  build: ./services
  init: true  # same crash method as FT (kill -9 of the app process); still no restart policy
  labels: {node: b}  # baseline = one server node; node_failure stops all of it
  environment:
    FT_MODE: "off"
    DATABASE_URL: postgresql://uni:uni@postgres-primary:5432/uni
  depends_on:
    postgres-primary:
      condition: service_healthy

services:
  postgres-primary:
    image: postgres:16
    environment:
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: uni
      POSTGRES_DB: uni
    labels: {node: b}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uni"]
      interval: 2s
      retries: 30

  student-service:
    <<: *service
    hostname: student-service
    command: uvicorn student:app --host 0.0.0.0 --port 8000

  transcript-service:
    <<: *service
    hostname: transcript-service
    command: uvicorn transcript:app --host 0.0.0.0 --port 8000

  payment-service:
    <<: *service
    hostname: payment-service
    command: uvicorn payment:app --host 0.0.0.0 --port 8000

  mock-bank:
    hostname: mock-bank
    build: ./services
    command: uvicorn mockbank:app --host 0.0.0.0 --port 8000
    ports:
      - "8090:8000"

  gateway:
    hostname: gateway
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/observability.conf:/etc/nginx/conf.d/00-observability.conf:ro
      - ./gateway/nginx.baseline.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [student-service, transcript-service, payment-service]

  monitor:  # measurement tool, not part of the system under test, so it may restart
    build: ./services
    restart: unless-stopped
    command: python monitor.py
    environment:
      MONITOR_OUT: /results/${MONITOR_FILE:-monitor_baseline.csv}
      MONITOR_TARGETS: >-
        student=http://student-service:8000,transcript=http://transcript-service:8000,payment=http://payment-service:8000,mock-bank=http://mock-bank:8000
    volumes:
      - ./results:/results

  # ---------- observability (both modes, measurement only) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.baseline.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/university.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  # Load generator, run on demand: docker compose -f ... run --rm workload
  workload:
    build: ./services
    profiles: ["tools"]
    volumes:
      - ./experiments:/exp
      - ./results:/results
    command: python /exp/workload.py
